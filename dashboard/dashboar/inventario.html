 <link rel="stylesheet" href="/style/dashboar.css">

        </div>

        <ul>
            <li>
                <a href="/dashboard/dashboar.html">
                    <i class="fas fa-home"></i>
                    <span>Dashboard</span>
                </a>
            </li>

            <li>
                <a href="/dashboard/dashboar/inventario.html">
                    <i class="fas fa-box"></i>

            </li>

            <li>
                <a href="/dashboard/dashboar/ordenes.html">
